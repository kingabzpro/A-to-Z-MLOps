apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-config
  namespace: mlops
data:
  MODEL_NAME: "news_classifier_logistic"
  # Empty means "serve the champion alias"; set to a number to pin a version.
  MODEL_VERSION: ""
  CACHE_TTL: "3600"
  RUN_PIPELINE: "false"
  GRAFANA_ADMIN_USER: "admin"
  LOCUST_USERS: "100"
  LOCUST_SPAWN_RATE: "10"
  LOCUST_MODE: "standalone"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'api'
        static_configs:
          - targets: ['api:7860']
        metrics_path: '/metrics'
  alert_rules.yml: |
    groups:
      - name: api-availability
        rules:
          - alert: ApiDown
            expr: up{job="api"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "News API is unreachable"
          - alert: ApiModelNotLoaded
            expr: model_loaded == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "News API has no model loaded"
      - name: api-performance
        rules:
          - alert: ApiHighErrorRate
            expr: |
              sum(rate(http_requests_total{job="api",status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="api"}[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "News API 5xx error rate above 5%"
          - alert: ApiHighLatencyP95
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(http_request_duration_seconds_bucket{job="api"}[5m])) by (le)
              ) > 1.0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "News API p95 latency above 1s"
