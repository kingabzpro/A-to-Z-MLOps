name: CI & Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Force a local MLflow store so tests never reach out to a cluster IP.
  MLFLOW_TRACKING_URI: file:./mlruns
  MLFLOW_ALLOW_FILE_STORE: "true"
  API_KEY: test_key

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Lint (flake8)
        run: flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W291,W293

      - name: Type-check (mypy)
        run: mypy src/

      - name: Run test suite
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  push_to_registries:
    name: Push Docker image to Docker Hub and GitHub Container Registry
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/A-to-Z-MLOps
            ghcr.io/${{ github.repository }}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load image locally for scanning
        # buildx pushes without keeping a local copy, and the pushed digest is
        # not resolvable by Trivy. Rebuild into the local daemon; the GHA layer
        # cache makes this fast.
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: a-to-z-mlops:scan
          cache-from: type=gha

      - name: Scan image for vulnerabilities (Trivy)
        # Pinned to the v0.36.0 commit. The action had a supply-chain advisory
        # (fixed in 0.35.0); Dependabot can still bump this SHA.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: a-to-z-mlops:scan
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Validate Docker image digest and tags
        run: |
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          if [[ -z "${{ steps.push.outputs.digest }}" || -z "${{ steps.meta.outputs.tags }}" ]]; then
            echo "Digest or tags are missing!"
            exit 1
          fi

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/a-to-z-mlops
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
